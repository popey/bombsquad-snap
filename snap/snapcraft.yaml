name: bombsquad
base: core26
version: '1.8.5'
summary: Bomb Squad
description: |
  8 Player Party Game Madness!
  Blow up your friends in mini-games ranging from capture-the-flag to hockey.
  Featuring gratuitous explosions, advanced ragdoll face-plant physics,
  pirates, ninjas, barbarians, insane chefs, and more. Supports PS3 controllers,
  XBox 360 controllers, most USB/Bluetooth gamepads, and even iOS and Android
  devices as controllers via the free 'BombSquad Remote' app. Bombs Away!
grade: stable
confinement: strict
platforms:
  amd64:
apps:
  bombsquad:
    environment:
      ALWAYS_USE_PULSEAUDIO: '1'
      ALSA_CONFIG_PATH: /snap/$SNAPCRAFT_PROJECT_NAME/current/usr/share/alsa
      PYTHONHOME: "$SNAP/usr"
      LIBGL_DRIVERS_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri"
      LD_LIBRARY_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/mesa:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/mesa-egl:/var/lib/snapd/lib/gl"
      __EGL_VENDOR_LIBRARY_DIRS: "/var/lib/snapd/lib/glvnd/egl_vendor.d:$__EGL_VENDOR_LIBRARY_DIRS"
    command: bin/launcher
    command-chain: ["snap/command-chain/alsa-launch"]
    plugs:
      - alsa
      - x11
      - opengl
      - desktop
      - network
      - network-bind
      - audio-playback
      - joystick
      - screen-inhibit-control

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

parts:
  launcher:
    plugin: dump
    source: snap/local
  bombsquad:
    after: [alsa-mixin]
    plugin: dump
    source: https://files.ballistica.net/bombsquad/builds/old/BombSquad_Linux_x86_64_$SNAPCRAFT_PROJECT_VERSION.tar.gz
    override-build: |
      craftctl default
      # Upstream asset files can be owner-only; snap files are owned by root.
      chmod -R a+rX "$CRAFT_PART_INSTALL/ba_data"
    stage-packages:
      - libatomic1
      - libsdl3-0
      - libcairo2
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libopenal1
      - libbsd0
      - libgl1-mesa-dri
      - libgl1
      - libglx-mesa0
      - libglu1-mesa
      - liblz4-1
      - liblzma5
      - libogg0
      - libsndio7.0
      - libvorbis0a
      - libvorbisfile3
      - libx11-6
      - libxau6
      - libxcb1
      - libxdmcp6
      - libopengl0
      - python3.14
      - libpython3.14

  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev
    stage-packages:
      - libasound2t64
      - libasound2-plugins
